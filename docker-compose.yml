# ─── Développement local ──────────────────────────────────────────────────────
# Lance l'addon Analytics précompilé (après npm run build dans api/ et web/)
# Pour le hot-reload, préférer :
#   cd api && npm run start:dev  (NestJS :3001)
#   cd web && npm run dev        (Vite :5174)

services:
  analytics:
    build: .
    container_name: uhq-addon-analytics
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT:          3001
      PANEL_URL:     http://host.docker.internal:8000
      NODE_ENV:      production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/uhq-manifest.json"]
      interval: 30s
      timeout:  5s
      retries:  3
